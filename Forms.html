<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete HTML Form Example</title>
</head>
<body>

  <h1>User Registration Form</h1>

  <form action="/register" method="POST">

    <!-- Text Input -->
    <div>
      <label for="full-name">Full Name:</label>
      <input type="text" id="full-name" name="fullName" required placeholder="Your Full Name">
    </div>

    <!-- Email Input -->
    <div>
      <label for="email">Email Address:</label>
      <input type="email" id="email" name="email" required placeholder="your@email.com">
    </div>

    <!-- Password Input -->
    <div>
      <label for="pwd">Password:</label>
      <input type="password" id="pwd" name="password" required minlength="8">
    </div>

    <!-- Number Input -->
    <div>
      <label for="age">Age:</label>
      <input type="number" id="age" name="age" min="18" max="100">
    </div>

    <!-- Radio Buttons -->
    <fieldset>
      <legend>Gender:</legend>
      <input type="radio" id="male" name="gender" value="male">
      <label for="male">Male</label>
      
      <input type="radio" id="female" name="gender" value="female">
      <label for="female">Female</label>
      
      <input type="radio" id="other" name="gender" value="other">
      <label for="other">Other</label>
    </fieldset>

    <!-- Checkbox Input -->
    <div>
      <input type="checkbox" id="terms" name="termsAccepted" value="yes" required>
      <label for="terms">I accept the terms and conditions</label>
    </div>

    <!-- Select Dropdown -->
    <div>
      <label for="role">Primary Role:</label>
      <select id="role" name="role">
        <option value="developer">Developer</option>
        <option value="designer">Designer</option>
        <option value="student">Student</option>
      </select>
    </div>

    <!-- Textarea -->
    <div>
      <label for="bio">Short Bio:</label> <br>
      <textarea id="bio" name="bio" rows="3" placeholder="Tell us about yourself..."></textarea>
    </div>

    <!-- Action Buttons -->
    <div>
      <button type="submit">Register Account</button>
      <button type="reset">Reset Form</button>
    </div>

  </form>

</body>
</html>
